# Steve Albini-style mix: the band in a room, as it played.
#
# What his records are known for (his own interviews: Sound On Sound, Tape Op, Bobby Owsinski):
# a live, resonant room with prominent room sound on the drums ("slightly distant but punchy"),
# guitars "bone dry ... practically spitting in your face", raw vocals compressed only a few dB,
# minimal EQ, no compression on the mix ("it sounds worse"), the full dynamic range, analog tape.
#
# So this keeps the fixes for the rehearsal room's defects (hum, snare-wire buzz, re-centring,
# consistent levels between songs) and drops the polish: no multiband/glue compression, no
# clipper, no transient shapers that take the room away, no exciters, gentler tonal EQ, the vocal
# room sound kept, guitars and bass louder and wider, a lower loudness target so the limiter only
# catches stray peaks. Written to processed/albini/, so it can be compared with the default sound:
#   uv run rehearsal-master --preset albini

[output]
dir = "processed/albini"

[eq]
strength = 0.4             # only the room's/recorder's worst
max_boost_db = 2.0

[multiband]
enabled = false

[saturation]               # analog tape: CHOW Tape Model hit a little hot, normal bias (head bump, softer top)
enabled = true
engine = "chowtape"
chowtape = { input_gain_db = 3.0, drive = 0.6, saturation = 0.6, bias = 0.5 }

[glue]
enabled = false

[clipper]
enabled = false

[limiter]
release_ms = 150.0         # slow and gentle: it only catches stray peaks

[loudness]
target_lufs = -18.0        # the full dynamic range: turn it up, it won't fall apart

[balance]                  # the band, not a singer with accompaniment: guitars and bass up front
prior_weight = 0.0         # the band's own balance, not the mix engineers' one
groups = [
  { name = "vocals", stems = ["vocals", "backing_vocals", "vocal_room"], lu = -8.5 },
  { name = "guitars", stems = ["guitar", "guitar_left", "guitar_right"], lu = -6.7 },
  { name = "bass", stems = ["bass"], lu = -6.5 },
  { name = "drums", stems = ["drum_bus", "drums"], lu = -4.1 },   # "slightly distant but punchy"
]

[drum_bus]                 # the kit in its room: barely glued, never crushed, no added room
compressor = { ratio = 1.3, threshold_pct = 92.0 }
parallel = { enabled = false }
room = { enabled = false }

[drum_bus.balance]         # more room and cymbals around kick and snare than the default kit
groups = [
  { name = "kick", stems = ["kick"], lu = -3.0 },
  { name = "snare", stems = ["snare"], lu = -0.5 },
  { name = "toms", stems = ["toms"], lu = -8.0 },
  { name = "cymbals", stems = ["hihat", "cymbals"], lu = -13.5 },
]

[rider]                    # no fader riding: the takes as they were played
enabled = false

[tracks.vocals]            # raw: compressed a few dB, little EQ, no exciter, no added reverb (the room is real)
sends = []
gain_db = 0.0
eq = [
  { type = "high_pass", freq_hz = 80.0, q = 0.7 },
  { type = "peak", freq_hz = 450.0, gain_db = -1.5, q = 1.0 },
]
compressor = { enabled = true, threshold_pct = 60.0, ratio = 3.0, knee_db = 6.0, attack_ms = 10.0, release_ms = 120.0, rms_ms = 10.0 }
saturator = { enabled = false }
exciter = { enabled = false }

[stems.vocal_room]
max_reduction_db = 0.0     # keep the room on the vocals: the vocal as recorded

[tracks.vocal_room]        # (only with recombine = false)
gain_db = 0.0

[tracks.guitar]            # bone dry and loud, with their body; a little wider than the default
balance = 0.6              # (also guitar_left / guitar_right)
width = 0.9
eq = [
  { type = "high_pass", freq_hz = 80.0, q = 0.7 },
  { type = "peak", freq_hz = 170.0, gain_db = 1.5, q = 0.8 },
  { type = "peak", freq_hz = 350.0, gain_db = -1.0, q = 1.6 },
]
saturator = { enabled = false }

[tracks.guitar_left]       # with the pan split on
pan = 0.0

[tracks.guitar_right]
pan = 0.45

[tracks.bass]              # prominent and gritty
saturator = { enabled = true, drive_db = 6.0, even = 0.3, mix = 0.3 }
bass_enhancer = { enabled = false }
transient = { enabled = false }

[tracks.kick]              # natural punch, no shaping, no samples
kick_eq = { gain_db = 2.0 }
augment = { enabled = false }
kick_shaper = { enabled = false }
transient = { enabled = false }
eq = [
  { type = "high_pass", freq_hz = 35.0, q = 0.7 },
  { type = "peak", freq_hz = 400.0, gain_db = -1.5, q = 1.0 },
  { type = "peak", freq_hz = 3500.0, gain_db = 2.0, q = 1.2 },
]

[tracks.snare]             # keep its ring and the room; only the buzz fix stays (gentler)
transient = { enabled = false }
augment = { enabled = false }
gate = { depth_db = 4.0, buzz_extra_db = 6.0 }   # the buzz fix stays, gentler

[tracks.toms]
transient = { enabled = false }
augment = { enabled = false }
gate = { depth_db = 6.0 }

[tracks.hihat]
transient = { enabled = false }

[tracks.cymbals]
transient = { enabled = false }
