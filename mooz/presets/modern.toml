# Modern pop-rock: maximum impact, width and clarity, every element controlled so the lead
# vocal and the rhythm section hit with radio-ready punch. Built on the default chain.
#
# Vocals pinned to the front (serial FET + opto compression, air with strict de-essing, width
# from a micro-pitch double rather than from more reverb); drums reinforced with tuned studio
# samples at an even level on every hit, sharper and tighter; a locked low end (high-passed
# guitars and vocals, the kick owning the sub, the bass above it and levelled hard); the two
# guitars split and hard-panned, with a pocket carved and ducked for the voice.
# Written to processed/modern/ (-14 LUFS):  uv run mooz --preset modern

[output]
dir = "processed/modern"

[loudness]
target_lufs = -14.0        # (at -13 the limiter worked up to 12 % of the time, costing punch)

[stems.pan_split]          # the two guitars as two stems, to pan them hard left and right
enabled = true

[stereo]
width = 1.15

[balance]
prior_weight = 0.6         # the voice in front, as in produced records

[rider]                    # a firm hand on the vocal fader
strength = 0.8
max_up_db = 4.0

[glue]
target_gr_db = 1.5

# the song styles set their own glue targets, which would win over the one above
[character.styles.wall]
glue = { target_gr_db = 2.0 }

[character.styles.steady]
glue = { target_gr_db = 1.5 }

[character.styles.dynamic]
glue = { target_gr_db = 1.3 }

[character.styles.build]
glue = { target_gr_db = 1.2 }

[character.styles.ballad]
glue = { target_gr_db = 1.0 }

[tracks.vocals]
eq = [
  { type = "high_pass", freq_hz = 100.0, q = 0.7 },              # nothing under the voice: the kick and bass own it
  { type = "peak", freq_hz = 180.0, gain_db = 1.0, q = 0.8 },
  { type = "peak", freq_hz = 450.0, gain_db = -2.0, q = 1.0 },
  { type = "peak", freq_hz = 3500.0, gain_db = 2.5, q = 0.8 },
  { type = "high_shelf", freq_hz = 10000.0, gain_db = 3.0, q = 0.7 },  # air / sheen...
]
dynamic_eq = [                                                   # ...with strict de-essing
  { freq_hz = 7000.0, q = 1.5, threshold_db = 4.0, ratio = 6.0, max_cut_db = 8.0 },
  { freq_hz = 5500.0, q = 2.0, threshold_db = 5.0, ratio = 4.0, max_cut_db = 5.0 },
  { mode = "boost", freq_hz = 180.0, q = 0.9, threshold_db = 3.0, ratio = 2.0, max_boost_db = 3.0 },
]
# serial compression: a fast FET-style one catching the peaks, then a slow opto-style one pinning the level
compressor = { enabled = true, threshold_pct = 75.0, ratio = 4.0, knee_db = 3.0, attack_ms = 1.0, release_ms = 50.0, rms_ms = 1.0 }
compressor2 = { enabled = true, threshold_pct = 50.0, ratio = 3.0, knee_db = 8.0, attack_ms = 10.0, release_ms = 300.0, rms_ms = 10.0 }
sends = [                                                        # width, not distance
  { type = "chorus", level_lu = -16.0, delay_ms = 12.0, depth_ms = 1.5, rate_hz = 0.35, hp_hz = 200.0, lp_hz = 9000.0 },
  { type = "plate", level_lu = -21.0, rt60_s = 1.0, predelay_ms = 25.0, damping = 0.4, hp_hz = 300.0, lp_hz = 8000.0 },
]

[tracks.kick]              # sample-enhanced: tuned studio kick at an even level; the kick owns the sub
eq = [
  { type = "high_pass", freq_hz = 30.0, q = 0.7 },
  { type = "low_shelf", freq_hz = 55.0, gain_db = 2.0, q = 0.7 },
  { type = "peak", freq_hz = 250.0, gain_db = -2.0, q = 1.2 },
  { type = "peak", freq_hz = 450.0, gain_db = -1.5, q = 1.0 },
  { type = "peak", freq_hz = 3500.0, gain_db = 4.0, q = 1.2 },
  { type = "high_shelf", freq_hz = 10000.0, gain_db = -4.0, q = 0.7 },
]
augment = { library = { mix = 0.55, flatten = 0.6 } }
transient = { attack = [0.0, 1.0], sustain = [-0.2, -0.5] }      # the beater's smack, shorter ring

[tracks.snare]
augment = { library = { mix = 0.55, flatten = 0.6 } }
transient = { attack = [0.3, 1.0, 0.4], sustain = [-0.5, -0.6, -0.4] }

[tracks.toms]
augment = { library = { mix = 0.45, flatten = 0.3 } }

[tracks.bass]              # just above the kick's sub, and every note at the same level
eq = [
  { type = "high_pass", freq_hz = 45.0, q = 0.7 },
  { type = "low_shelf", freq_hz = 100.0, gain_db = 1.5, q = 0.7 },
  { type = "peak", freq_hz = 350.0, gain_db = -2.0, q = 0.7 },
  { type = "peak", freq_hz = 800.0, gain_db = 1.0, q = 1.0 },
  { type = "peak", freq_hz = 2500.0, gain_db = 0.5, q = 0.9 },
  { type = "low_pass", freq_hz = 6000.0, q = 0.7 },
]
compressor2 = { enabled = true, threshold_pct = 40.0, ratio = 8.0, knee_db = 4.0, attack_ms = 5.0, release_ms = 120.0, rms_ms = 10.0 }

[tracks.guitar]            # (also both split guitars) out of the low end, a pocket for the voice
eq = [
  { type = "high_pass", freq_hz = 100.0, q = 0.7 },
  { type = "peak", freq_hz = 170.0, gain_db = 2.0, q = 0.8 },
  { type = "peak", freq_hz = 350.0, gain_db = -1.0, q = 1.6 },
  { type = "peak", freq_hz = 1600.0, gain_db = -2.0, q = 1.0 },  # where the lead vocal lives
  { type = "peak", freq_hz = 6000.0, gain_db = -2.0, q = 1.0 },
  { type = "high_shelf", freq_hz = 8000.0, gain_db = -1.5, q = 0.7 },
]
ducks = [
  { source = "kick", fmin_hz = 0.0, fmax_hz = 150.0, depth_db = 3.0, release_ms = 150.0 },
  { source = "kick", fmin_hz = 2000.0, fmax_hz = 5000.0, depth_db = 2.5, release_ms = 60.0 },
  { source = "snare", fmin_hz = 2000.0, fmax_hz = 6000.0, depth_db = 2.0, release_ms = 80.0, purpose = "cleanup" },
  { source = "vocals", fmin_hz = 1000.0, fmax_hz = 2500.0, depth_db = 2.0, release_ms = 120.0 },  # only while singing
]
width = 1.0                # if the two guitars could not be split: keep the stem's full spread

[tracks.guitar_left]       # hard left, hard right
width = 0.0
pan = -1.0

[tracks.guitar_right]
width = 0.0
pan = 1.0
